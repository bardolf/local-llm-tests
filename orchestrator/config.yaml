# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap – jeden port, podle pole "model" v requestu spustí příslušný backend.
# Backendy jsou skripty v services/*/run.sh (dají se pouštět i ručně bez orchestrátoru).
# Podrobnosti: orchestrator/README.md

healthCheckTimeout: 180
logLevel: info
logTimeFormat: rfc3339
logToStdout: "proxy"
startPort: 8201          # backendy dostanou porty 8201+ (jen na 127.0.0.1)
sendLoadingState: false  # neposílat "loading…" do reasoning pole – skripty chtějí čistý výstup

# Nečinný model se po 10 minutách uvolní z VRAM (per-model přepsáno níž).
globalTTL: 600

macros:
  svc: "${env.HOME}/projects/audiobooksprocessing/desktop/services"

models:
  # ---------- chat ----------
  "qwen9b":
    name: "Qwen3.5 9B Q4_K_M"
    description: "Větší, ale na Vulkanu pomalý (~16 tok/s) a v testu nebyl lepší než gemma4b"
    cmd: ${svc}/chat/run.sh qwen9b ${PORT}
    aliases: ["chat-big"]
    ttl: 600

  "qwen4b":
    name: "Qwen3.5 4B Q4_K_M"
    description: "Pomalý na Vulkanu (~19 tok/s), v testu halucinoval – spíš jen pro srovnání"
    cmd: ${svc}/chat/run.sh qwen4b ${PORT}
    ttl: 600

  "gemma4b":
    name: "Gemma 4 E4B Q4_0"
    description: "Výchozí chat: ~43 tok/s, nejlepší čeština a nejméně halucinací v testu"
    cmd: ${svc}/chat/run.sh gemma4b ${PORT}
    aliases: ["chat"]
    ttl: 600

  "gemma4b-long":
    name: "Gemma 4 E4B – dlouhá konverzace"
    description: "1 slot, 64k kontext (bin/ai talk, web chat /upstream/chat-long/)"
    cmd: ${svc}/chat/run.sh gemma4b-long ${PORT}
    aliases: ["chat-long"]
    ttl: 900

  # ---------- vision (popis/kontrola obrázků, např. obálek) ----------
  "qwen9b-vision":
    name: "Qwen3.5 9B + vision"
    description: "Kontrola obálek: OCR bez chyb, věcný popis; ~20–40 s, ~6.5 GB → běží sám"
    cmd: ${svc}/chat/run.sh qwen9b-vision ${PORT}
    aliases: ["vision"]
    ttl: 300

  "gemma4b-vision":
    name: "Gemma 4 E4B + vision"
    description: "Rychlejší kontrola obálek (~17 s, ~4 GB); OCR s drobnými chybami, popis méně přesný"
    cmd: ${svc}/chat/run.sh gemma4b-vision ${PORT}
    aliases: ["vision-fast"]
    ttl: 300

  # ---------- embeddingy ----------
  "bge-m3":
    name: "BGE-M3 Q8_0 (1024 dim)"
    cmd: ${svc}/embed/run.sh bge-m3 ${PORT}
    aliases: ["embed"]
    ttl: 900

  "qwen3-emb":
    name: "Qwen3-Embedding 0.6B Q8_0 (1024 dim)"
    cmd: ${svc}/embed/run.sh qwen3-emb ${PORT}
    ttl: 900

  # ---------- přepis řeči ----------
  "whisper":
    name: "Whisper large-v3-turbo q8_0"
    description: "POST /v1/audio/transcriptions, multipart file=, language=cs"
    cmd: ${svc}/whisper/run.sh turbo-q8 ${PORT}
    aliases: ["whisper-1"]   # výchozí jméno v OpenAI klientech
    ttl: 900

  # ---------- překlad ----------
  "translate":
    name: "Překlad (služba) – POST /upstream/translate/translate {text, source, target}"
    description: "Skládá prompt pro překladový model; sama GPU nepoužívá"
    cmd: ${svc}/translate/run.sh ${PORT}
    checkEndpoint: /health
    ttl: 900

  "translategemma":
    name: "TranslateGemma 4B Q6_K"
    description: "Google, překladový model (55 jazyků); volat přes službu translate"
    cmd: ${svc}/chat/run.sh translategemma ${PORT}
    ttl: 600

  "hunyuan-mt":
    name: "Hunyuan-MT 7B Q4_K_M"
    description: "Tencent, vítěz WMT25; volat přes službu translate"
    cmd: ${svc}/chat/run.sh hunyuan-mt ${PORT}
    ttl: 600

  # ---------- generování obrázků ----------
  "z-image":
    name: "Z-Image-Turbo Q4_K (stable-diffusion.cpp)"
    description: "POST /v1/images/generations {prompt, size}; 1024² ~65 s, VRAM špička ~4.7 GB nad baseline"
    cmd: ${svc}/image/run.sh ${PORT}
    checkEndpoint: /
    aliases: ["image"]
    ttl: 300

  "image-edit":
    name: "Úprava obrázku podle instrukce (FLUX.2-klein 4B)"
    description: "POST /upstream/image-edit/edit (multipart file, prompt, size) → PNG; ~50 s / 768 px, VRAM ~5.5 GB během úpravy"
    cmd: ${svc}/image/run-edit.sh ${PORT}
    checkEndpoint: /health
    ttl: 300

  # ---------- rozpoznání jazyka audio stopy ----------
  "langid":
    name: "Rozpoznání jazyka audio stopy (služba)"
    description: "POST /upstream/langid/detect (multipart file, víckrát) → jazyk, ISO 639-1/2, jistota; volá whisper"
    cmd: ${svc}/langid/run.sh ${PORT}
    checkEndpoint: /health
    ttl: 900

  # ---------- upscale obálek ----------
  "upscale":
    name: "Upscale obálek (siax / atd / …)"
    description: "POST /upstream/upscale/upscale, multipart file=, model=siax|atd, width="
    cmd: ${svc}/upscale/run.sh ${PORT}
    checkEndpoint: /health
    ttl: 300

# Co smí běžet současně (8 GB VRAM). Solver při požadavku na model X vybere
# nejlevnější množinu obsahující X a vyhodí, co v ní není.
# Naměřeno (nad baseline 1.22 GB desktopu): gemma4b 2.8, qwen4b 2.8, qwen9b 5.0,
# bge-m3 0.6, whisper 0.8 GB. Po přechodu na -np 4: gemma4b+bge-m3+whisper = 5.83 GB celkem,
# qwen9b+bge-m3 = 6.95 GB. upscale: siax (ncnn) jen po dobu požadavku, atd drží ~1 GB + ROCm kontext.
# Viz docs/BENCHMARKS.md.
routing:
  router:
    use: matrix
    settings:
      matrix:
        vars:
          q9: qwen9b
          q4: qwen4b
          g4: gemma4b
          gl: gemma4b-long
          e:  bge-m3
          e2: qwen3-emb
          w:  whisper
          up: upscale
          v:  qwen9b-vision
          vf: gemma4b-vision
          tr: translate
          lid: langid
          tg: translategemma
          hm: hunyuan-mt
          img: z-image
          ie: image-edit
        evict_costs:
          q9: 3      # nejpomalejší start
        sets:
          big_chat:   "q9 & (e | e2) & tr & lid"
          small_chat: "(q4 | g4 | gl) & (e | e2) & w & up & tr & lid"
          audio:      "w & (e | e2) & up & tr & lid"
          vision:     "v & tr & lid"
          vision_fast: "vf & (e | e2) & up & tr & lid"
          translation: "tg & tr & lid & (e | e2) & w & up"
          translation_big: "hm & tr & lid & (e | e2)"
          image:      "img & tr & lid & (e | e2)"
          image_edit: "ie & tr & lid"
